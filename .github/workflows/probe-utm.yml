name: Analise UTM (temporario)

on:
  workflow_dispatch:
  push:
    branches: [ "claude/dashboard-traffic-control-2h3brj" ]
    paths:
      - "build/tools/probe_utm.py"
      - ".github/workflows/probe-utm.yml"

permissions:
  contents: read

jobs:
  analisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python build/tools/probe_utm.py
