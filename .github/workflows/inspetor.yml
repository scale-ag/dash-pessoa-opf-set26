# WORKFLOW TEMPORARIO — valida o build do repo novo (dash-marlon-mattedi) antes
# do repositorio existir. Roda no runner, que alcanca docs.google.com (o sandbox
# do agente nao alcanca — CLAUDE.md, problema conhecido #4).
# Sera removido junto com tools/ quando o repo novo estiver no ar.
name: Inspetor de Planilhas (temporario)

on:
  workflow_dispatch:
  push:
    branches: [ claude/dash-marlon-mattedi-setup-k6dral ]
    paths:
      - "tools/**"
      - ".github/workflows/inspetor.yml"

permissions:
  contents: read

jobs:
  validar-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build do dashboard MARLON MATTEDI (le as planilhas, somente leitura)
        run: |
          python tools/marlon-staging/build/build.py \
            --template tools/marlon-staging/build/template.html \
            --out dist/index.html

      - name: Conferir a saida gerada
        run: |
          set -e
          echo "=== tamanho ==="
          ls -la dist/index.html
          python - <<'PY'
          import json, re, pathlib
          html = pathlib.Path("dist/index.html").read_text(encoding="utf-8")
          m = re.search(r'<script id="payload" type="application/json">(.*?)</script>',
                        html, re.S)
          assert m, "ERRO: bloco <script id=payload> nao encontrado no HTML"
          data = json.loads(m.group(1))
          b, meta, sales = data["build"], data["meta"], data["sales"]
          print(f"cliente          : {b['client_name']} / {b['client_sub']}")
          print(f"produto principal: {b['main_product']}  (prefixo {b['main_product_prefix']!r})")
          print(f"periodo          : {b['date_min']} .. {b['date_max']}")
          print(f"metas            : CAC {b['cac_target']} | ROAS {b['roas_target']} | imposto x{b['tax_factor']}")
          print(f"registros meta   : {len(meta)}")
          print(f"vendas           : {len(sales)}  (produto principal: {sum(s['main'] for s in sales)})")
          print(f"gasto total      : R$ {sum(r['sp'] for r in meta):,.2f}")
          print(f"faturamento      : R$ {sum(s['val'] for s in sales):,.2f}")
          atrib = sum(s["meta"] for s in sales)
          print(f"vendas casadas com o Meta (trafego pago): {atrib}")
          assert meta,  "ERRO: nenhum registro do Meta Ads"
          assert sales, "ERRO: nenhuma venda — is_paid() pode ter descartado tudo"
          assert atrib, "ERRO: zero vendas atribuidas ao Meta — AD_UTM_COLUMN errado?"
          print("\nOK: build valido.")
          PY

      - name: Publicar o HTML como artifact (para inspecao)
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-marlon-preview
          path: dist/index.html
