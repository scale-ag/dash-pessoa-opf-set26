name: Sondagem das Planilhas (temporario)

# Workflow TEMPORARIO de configuracao do cliente: descobre os nomes das abas,
# os gids e os cabecalhos das planilhas. O runner do GitHub Actions alcanca o
# docs.google.com, o que o sandbox do agente nao alcanca.
# Removido do repositorio assim que a configuracao terminar.
on:
  workflow_dispatch:
  push:
    branches: [ "claude/dashboard-traffic-control-2h3brj" ]
    paths:
      - "build/tools/probe_sheets.py"
      - ".github/workflows/probe-planilhas.yml"

permissions:
  contents: read

jobs:
  sondar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Sondar planilhas (somente leitura, sem imprimir PII)
        run: python build/tools/probe_sheets.py
